<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Molink Tecnología | Portafolio de Proyectos</title>
    <meta name="description"
          content="Explora nuestros proyectos más destacados en una galería inmersiva. Descubre cómo transformamos ideas en realidades digitales.">
    <meta name="keywords" content="portafolio, proyectos, desarrollo web, desarrollo movil, molink, tecnologia, cúcuta">
    <link href="/assets/favicon.svg" rel="icon" type="image/svg+xml">

<body class="bg-black text-white font-default">

<div id="header-placeholder"></div>

<main class="py-20">

        * 3D Gallery Section

        <section id="portfolio-gallery" class="gallery-frame w-[90vw] h-[85vh] max-w-7xl mx-auto">

                        <video src="/assets/videos/videoProjectLider.mp4" class="gallery-media" loop muted autoplay

                    </div>
                    <div class="gallery-item">
                        <img src="/assets/clients/liderplast.webp" alt="Proyecto 2" class="gallery-media">
                    </div>

                        <video src="/assets/videos/videoProjectProductivas.mp4" class="gallery-media" loop muted
                               autoplay
                               playsinline></video>
                    </div>
                    <div class="gallery-item">
                        <img src="/assets/clients/sena2023.webp" alt="Proyecto 4" class="gallery-media">
                    </div>
                    <div class="gallery-item">
                        <video src="/assets/videos/videoProjectEncontrable.mp4" class="gallery-media" loop muted
                               autoplay
                               playsinline></video>
                    </div>
                    <div class="gallery-item">
                        <img src="/assets/clients/encontrable.webp" alt="Proyecto 6" class="gallery-media">
                    </div>
                    <!-- Añade más proyectos aquí -->
                </div>

</main>

<!-- Footer -->
<div id="footer-placeholder"></div>

<!-- Scripts -->
<script type="module" src="/src/main.ts"></script>
