        <a href="/" class="flex items-center">
            <img src="/assets/logo-white.webp" alt="Logo de Molink Tecnologia Blanco" class="h-12 w-auto">
        </a>

        <!-- Menú de Navegación Desktop -->
        <nav id="navmenu" class="hidden lg:flex">
            <ul class="flex items-center space-x-2">
                <li>
                    <a href="/#start" aria-label="boton inicio"
                       class="block rounded-md px-4 py-2 font-nav text-xl text-white transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-[#f30519]/40">
                        Inicio
                    </a>
                </li>
                <li>
                    <a href="/src/pages/portfolio.html" aria-label="boton Portafolio"
                       class="block rounded-md px-4 py-2 font-nav text-xl text-white transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-[#f30519]/40">

                    </a>
                </li>
                <li>
                    <a href="/#services" aria-label="boton servicios"

                        Servicios
                    </a>
                </li>
                <li>
                    <a href="/#contact" aria-label="boton contacto"
                       class="block rounded-md px-4 py-2 font-nav text-xl text-white transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-[#f30519]/40">
                        Contacto
                    </a>
                </li>
            </ul>
        </nav>
        <!-- Botón del Menú Móvil -->
        <button id="mobile-nav-toggle" class="lg:hidden text-nav text-3xl z-[9999]" aria-label="Abrir menú móvil">
            <i class="bi bi-list"></i>
        </button>
    </div>
</header>

        </li>
